# SPDX-License-Identifier: Apache-2.0
name: pytest

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        # The reference host refuses to run as root. GitHub-hosted runners
        # execute this job as root, so the suite runs as its own user.
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            id peptest >/dev/null 2>&1 || useradd --create-home --user-group peptest
            chown -R peptest:peptest .
            runuser -u peptest -- env HOME=/home/peptest PATH="$PATH" PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}" pytest
          else
            pytest
          fi
      - name: Official eval/ deny receipt
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            runuser -u peptest -- env HOME=/home/peptest PATH="$PATH" PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}" python -m pep.demo
          else
            python -m pep.demo
          fi
