name: lab-brand-wall

on:
  pull_request:
  push:
    branches: [main]

jobs:
  wall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lab-only brand wall
        run: python3 scripts/lab_brand_wall.py
