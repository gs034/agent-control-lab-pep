# SPDX-License-Identifier: Apache-2.0
name: reference-host-live

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Live deployment check as two operating-system users
        run: sudo "$(command -v python3)" scripts/reference_host_check/live_check.py --source .
