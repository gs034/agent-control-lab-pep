# SPDX-License-Identifier: Apache-2.0
name: lab-only

on:
  pull_request:
  push:
    branches: [main]

jobs:
  forbidden-tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Lab-only forbidden token check
        run: bash scripts/check_lab_only.sh
