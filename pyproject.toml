# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-control-lab-pep"
version = "0.2.0"
description = "Agent Control Lab reference host/runtime Policy Enforcement Point (v0.2 foundation)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Agent Control Lab contributors" }]
keywords = ["ai-control", "policy-enforcement-point", "public-goods"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pep-demo = "pep.demo:main"

[project.urls]
Homepage = "https://github.com/gs034/agent-control-lab-pep"

[tool.setuptools.packages.find]
include = ["pep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
